
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 16px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #fce7f3);
      color: #1f2937;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 8px;
      color: #4338ca;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      font-size: 14px;
    }

    .add-btn {
      padding: 12px 18px;
      color: white;
      background: #4f46e5;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #3730a3;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 9px 13px;
      background: #f3f4f6;
      color: #374151;
    }

    .filter-btn.active {
      background: #4f46e5;
      color: white;
    }

    #taskList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 10px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .task input[type="checkbox"] {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-btn {
      padding: 8px 10px;
      background: #fee2e2;
      color: #b91c1c;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .empty {
      padding: 25px 5px;
      text-align: center;
      color: #9ca3af;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 14px;
    }

    .clear-btn {
      padding: 9px 11px;
      background: #f3f4f6;
      color: #374151;
    }

    .clear-btn:hover {
      background: #e5e7eb;
    }

    @media (max-width: 450px) {
      .app {
        padding: 20px 15px;
      }

      .task-form {
        flex-wrap: wrap;
      }

      .task-form input {
        width: 100%;
        flex-basis: 100%;
      }

      .add-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <a class="back" href="index.html">← Back to Portfolio</a>

    <h1>My To-Do List 📝</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <form class="task-form" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="What do you need to do?"
        maxlength="200"
        aria-label="New task"
        required
      >
      <button class="add-btn" type="submit">+ Add Task</button>
    </form>

    <div class="filters" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span id="taskCount">0 tasks left</span>
      <button class="clear-btn" id="clearCompleted">
        Clear Completed
      </button>
    </div>
  </main>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const clearCompleted = document.getElementById("clearCompleted");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let tasks = [];

    try {
      const savedTasks = JSON.parse(
        localStorage.getItem("myTodoTasks") || "[]"
      );

      if (Array.isArray(savedTasks)) {
        tasks = savedTasks.filter(
          task =>
            task &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean" &&
            typeof task.id === "string"
        );
      }
    } catch (error) {
      tasks = [];
    }

    let currentFilter = "all";

    function saveTasks() {
      try {
        localStorage.setItem("myTodoTasks", JSON.stringify(tasks));
      } catch (error) {
        alert("Your browser could not save the tasks.");
      }
    }

    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      if (visibleTasks.length === 0) {
        const emptyMessage = document.createElement("li");
        emptyMessage.className = "empty";

        emptyMessage.textContent =
          tasks.length === 0
            ? "No tasks yet. Add your first task above!"
            : "No tasks in this category.";

        taskList.appendChild(emptyMessage);
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = "task";

        if (task.completed) {
          item.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          "aria-label",
          "Mark " + task.text + " as completed"
        );

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", "Delete " + task.text);

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, deleteButton);
        taskList.appendChild(item);
      });

      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent =
        remaining + (remaining === 1 ? " task left" : " tasks left");

      filterButtons.forEach(button => {
        const selected = button.dataset.filter === currentFilter;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (!text) return;

      tasks.push({
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        text: text,
        completed: false
      });

      saveTasks();
      currentFilter = "all";
      taskInput.value = "";
      renderTasks();
      taskInput.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        renderTasks();
      });
    });

    clearCompleted.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
